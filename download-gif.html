<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar Flow GIF Download</title>
    <style>
      :root {
        --bg: #071713;
        --panel: #0d2421;
        --panel-2: #12312d;
        --line: rgba(112, 211, 183, 0.18);
        --text: #ebf9f6;
        --muted: #9bb6b0;
        --accent: #5fe7bf;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #12312d, var(--bg) 50%);
        color: var(--text);
        font-family: Inter, Segoe UI, sans-serif;
      }

      .wrap {
        width: min(1100px, 92vw);
        background: rgba(22, 39, 36, 0.9);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: 0 24px 80px rgba(0,0,0,0.38);
        padding: 22px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .title {
        font-size: clamp(22px, 2.2vw, 34px);
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .download-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 12px;
        background: linear-gradient(135deg, #5fe7bf, #7ce6ad);
        color: #07231d;
        font-weight: 800;
        text-decoration: none;
        box-shadow: 0 10px 22px rgba(95, 231, 191, 0.25);
      }

      .frame {
        background: rgba(9, 24, 24, 0.9);
        border: 1px solid var(--line);
        border-radius: 22px;
        overflow: hidden;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div class="title">Solar Flow Full-Size Interface</div>
        <a class="download-btn" href="solar-flow-hero-fullsize.gif" download>Download GIF</a>
      </div>
      <div class="frame">
        <img src="solar-flow-hero-fullsize.gif" alt="Solar Flow full-size hero animation" />
      </div>
    </div>
  </body>
</html>
